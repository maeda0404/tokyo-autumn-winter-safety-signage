<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>東京 秋冬安全情報</title>

  <style>
    :root {
      --gap: clamp(5px, 1.05vmin, 10px);
      --radius: clamp(9px, 1.5vmin, 16px);
      --blue: #155eb5;
      --purple: #7138ad;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Yu Gothic", "Meiryo", sans-serif;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      background: #edf2f7;
      color: #111111;
    }

    body {
      padding: var(--gap);
      display: grid;
      grid-template-rows:
        clamp(58px, 11.5vh, 88px)
        minmax(0, 1fr)
        clamp(32px, 6.5vh, 48px);
      gap: var(--gap);
    }

    .header,
    .footer {
      border-radius: var(--radius);
      display: flex;
      align-items: center;
    }

    .header {
      min-width: 0;
      padding: 0 clamp(18px, 3vw, 34px);
      justify-content: space-between;
      gap: 12px;
      background: var(--blue);
      color: #ffffff;
      font-size: clamp(23px, 3.9vmin, 42px);
      font-weight: 900;
      white-space: nowrap;
      overflow: hidden;
    }

    .header-title {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #clock {
      flex-shrink: 0;
      font-size: clamp(20px, 3.2vmin, 34px);
      font-weight: 900;
      font-variant-numeric: tabular-nums;
    }

    main {
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-rows: minmax(0, 1.22fr) minmax(0, 0.78fr);
      gap: var(--gap);
    }

    .flu {
      min-width: 0;
      min-height: 0;
      border: clamp(3px, 0.65vmin, 5px) solid var(--purple);
      border-radius: var(--radius);
      background: #fbf7ff;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      overflow: hidden;
    }

    .panel-title {
      padding: clamp(7px, 1.35vh, 13px);
      background: var(--purple);
      color: #ffffff;
      text-align: center;
      font-size: clamp(24px, 4vmin, 44px);
      font-weight: 900;
      line-height: 1;
      white-space: nowrap;
    }

    .flu-main {
      min-width: 0;
      min-height: 0;
      padding: clamp(7px, 1.35vmin, 14px);
      display: grid;
      grid-template-columns: minmax(0, 0.55fr) minmax(0, 1.45fr);
      align-items: center;
      gap: clamp(5px, 1vmin, 10px);
    }

    .flu-caption {
      text-align: center;
      font-size: clamp(21px, 3.4vmin, 37px);
      font-weight: 900;
      line-height: 1.2;
    }

    .flu-data {
      min-width: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      grid-template-rows: auto auto auto;
      justify-items: center;
      align-items: center;
      row-gap: clamp(3px, 0.8vmin, 9px);
    }

    .flu-level {
      width: 100%;
      min-width: 0;
      text-align: center;
      color: var(--purple);
      font-size: clamp(34px, 7.4vmin, 80px);
      font-weight: 900;
      line-height: 1;
      white-space: nowrap;
      overflow: hidden;
    }

    .sentinel-box {
      width: 100%;
      min-width: 0;
      display: flex;
      justify-content: center;
      align-items: baseline;
      gap: clamp(6px, 1.2vmin, 14px);
    }

    .sentinel-label {
      flex-shrink: 0;
      font-size: clamp(14px, 2.1vmin, 23px);
      font-weight: 900;
      line-height: 1.05;
      white-space: nowrap;
    }

    .sentinel-value {
      min-width: 0;
      color: #4e208d;
      font-size: clamp(38px, 7vmin, 76px);
      font-weight: 900;
      line-height: 0.95;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      overflow: hidden;
    }

    .sentinel-unit {
      margin-left: 0.08em;
      font-size: 0.48em;
    }

    .flu-meta {
      width: 100%;
      text-align: center;
      font-size: clamp(14px, 2.1vmin, 23px);
      font-weight: 900;
      line-height: 1.1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .actions {
      padding: clamp(6px, 1vmin, 10px);
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: var(--gap);
      background: #eee2f8;
    }

    .action {
      min-width: 0;
      padding: clamp(7px, 1.1vmin, 12px) 3px;
      background: #ffffff;
      border-radius: 12px;
      text-align: center;
      font-size: clamp(18px, 2.8vmin, 30px);
      font-weight: 900;
      line-height: 1;
      white-space: nowrap;
    }

    .weather {
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: var(--gap);
    }

    .card {
      min-width: 0;
      min-height: 0;
      border: clamp(3px, 0.65vmin, 5px) solid currentColor;
      border-radius: var(--radius);
      padding: clamp(7px, 1.2vmin, 14px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      overflow: hidden;
    }

    .card-name {
      font-size: clamp(29px, 5vmin, 52px);
      font-weight: 900;
      line-height: 1;
      white-space: nowrap;
    }

    .card-state {
      margin-top: clamp(6px, 1vmin, 11px);
      font-size: clamp(19px, 3.1vmin, 32px);
      font-weight: 900;
      line-height: 1.05;
      white-space: nowrap;
    }

    .card-note {
      margin-top: clamp(4px, 0.7vmin, 8px);
      color: #17212b;
      font-size: clamp(15px, 2.2vmin, 23px);
      font-weight: 900;
      line-height: 1.1;
      white-space: nowrap;
    }

    .wind {
      color: #1565c0;
      background: #f3f8ff;
    }

    .dry {
      color: #dc5a00;
      background: #fff8ee;
    }

    .cold {
      color: #008577;
      background: #effcf9;
    }

    .card.active {
      box-shadow: inset 0 0 0 clamp(1px, 0.3vmin, 3px) currentColor;
      animation: pulse 2s ease-in-out infinite;
    }

    .card.active .card-state {
      font-size: clamp(21px, 3.5vmin, 37px);
    }

    @keyframes pulse {
      50% {
        filter: brightness(0.94);
      }
    }

    .footer {
      min-width: 0;
      justify-content: center;
      padding: 0 10px;
      background: #ffffff;
      color: #3e4954;
      font-size: clamp(13px, 2vmin, 21px);
      font-weight: 900;
      line-height: 1;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .error {
      color: #b00020 !important;
    }

    @media screen and (max-aspect-ratio: 4 / 5) {
      main {
        grid-template-rows: minmax(0, 1fr) minmax(0, 1.45fr);
      }

      .flu-main {
        grid-template-columns: 1fr;
      }

      .flu-caption br {
        display: none;
      }

      .flu-data {
        grid-template-columns: minmax(0, 1fr);
      }

      .weather {
        grid-template-columns: 1fr;
        grid-template-rows: repeat(3, minmax(0, 1fr));
      }

      .card {
        flex-direction: row;
        justify-content: space-between;
        gap: 10px;
      }

      .card-state,
      .card-note {
        margin-top: 0;
      }
    }

        @media screen and (max-height: 560px) {
      body {
        grid-template-rows: 48px minmax(0, 1fr) 26px;
        gap: 4px;
        padding: 4px;
      }

      .panel-title,
      .flu-main,
      .actions,
      .card {
        padding: 5px;
      }

      .card-name {
        font-size: clamp(20px, 4.2vmin, 40px);
      }

      .card-state,
      .card.active .card-state {
        margin-top: 3px;
        font-size: clamp(14px, 2.8vmin, 26px);
      }

      .card-note {
        display: block;
        margin-top: 2px;
        font-size: clamp(11px, 2.2vmin, 18px);
        white-space: normal;
        line-height: 1.15;
      }
    }
  </style>
</head>

<body>
  <header class="header">
    <div class="header-title">東京　秋冬安全情報</div>
    <div id="clock">--:--:--</div>
  </header>

  <main>
    <section class="flu">
      <div class="panel-title">インフルエンザ情報</div>

      <div class="flu-main">
        <div class="flu-caption">東京都の<br>流行状況</div>

        <div class="flu-data">
          <div class="flu-level" id="fluLevel">確認中</div>

          <div class="sentinel-box">
            <div class="sentinel-label">定点当たり報告数</div>
            <div class="sentinel-value" id="perSentinel">
              --<span class="sentinel-unit">人</span>
            </div>
          </div>

          <div class="flu-meta" id="fluMeta">データ取得中</div>
        </div>
      </div>

      <div class="actions">
        <div class="action">手洗い</div>
        <div class="action">換気</div>
        <div class="action">体調報告</div>
      </div>
    </section>

    <section class="weather">
      <article class="card wind" id="windCard">
        <div class="card-name">強風</div>
        <div class="card-state" id="windState">確認中</div>
        <div class="card-note" id="windNote"></div>
      </article>

      <article class="card dry" id="dryCard">
        <div class="card-name">乾燥</div>
        <div class="card-state" id="dryState">確認中</div>
        <div class="card-note" id="dryNote"></div>
      </article>

      <article class="card cold" id="coldCard">
        <div class="card-name">低温</div>
        <div class="card-state" id="coldState">確認中</div>
        <div class="card-note" id="coldNote"></div>
      </article>
    </section>
  </main>

  <footer class="footer" id="footer">データを読み込んでいます</footer>

  <script>
    "use strict";

    const DATA_URL = "./data/status.json";

    // 枠からはみ出す場合、収まるまで文字サイズを1pxずつ小さくする
    function fitText(element, minSize) {
      if (!element) {
        return;
      }

      element.style.fontSize = "";
      let size = parseFloat(getComputedStyle(element).fontSize);

      while (element.scrollWidth > element.clientWidth && size > minSize) {
        size -= 1;
        element.style.fontSize = size + "px";
      }
    }

    function fitInfluenza() {
      fitText(document.getElementById("fluLevel"), 16);
      fitText(document.getElementById("perSentinel"), 16);
    }

    function updateClock() {
      document.getElementById("clock").textContent =
        new Date().toLocaleTimeString("ja-JP", {
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
          hour12: false
        });
    }

    function displayCard(key, item) {
      const card = document.getElementById(key + "Card");

      document.getElementById(key + "State").textContent =
        item.active ? item.alertText : item.normalText;

      document.getElementById(key + "Note").textContent =
        item.note || "";

      card.classList.toggle("active", Boolean(item.active));
    }

    function displayInfluenza(influenza) {
      const levelElement = document.getElementById("fluLevel");
      const valueElement = document.getElementById("perSentinel");
      const metaElement = document.getElementById("fluMeta");

      levelElement.classList.remove("error");
      levelElement.textContent = influenza.level || "確認中";

      const value = Number(influenza.perSentinel);

      if (Number.isFinite(value)) {
        valueElement.innerHTML =
          value.toFixed(2) + '<span class="sentinel-unit">人</span>';
      } else {
        valueElement.innerHTML =
          '--<span class="sentinel-unit">人</span>';
      }

      const metaParts = [];

      if (influenza.week) {
        metaParts.push(influenza.week);
      }

      if (influenza.period && influenza.period !== "東京都") {
        metaParts.push(influenza.period);
      }

      metaElement.textContent =
        metaParts.length > 0
          ? metaParts.join("　")
          : "最新情報を確認中";

      fitInfluenza();
    }

    async function loadData() {
      try {
        const response = await fetch(
          DATA_URL + "?t=" + Date.now(),
          { cache: "no-store" }
        );

        if (!response.ok) {
          throw new Error("status.json HTTP " + response.status);
        }

        const data = await response.json();

        displayInfluenza(data.influenza || {});
        displayCard("wind", data.weather.wind);
        displayCard("dry", data.weather.dry);
        displayCard("cold", data.weather.cold);

        document.getElementById("footer").textContent =
          "更新：" + data.updated + "　" + (data.sourceStatus || "");
      } catch (error) {
        console.error(error);

        document.getElementById("fluLevel").textContent = "取得失敗";
        document.getElementById("fluLevel").classList.add("error");
        document.getElementById("perSentinel").innerHTML =
          '--<span class="sentinel-unit">人</span>';
        document.getElementById("fluMeta").textContent =
          "データ取得を確認してください";
        document.getElementById("footer").textContent =
          "データ更新を確認してください";

        fitInfluenza();
      }
    }

    updateClock();
    setInterval(updateClock, 1000);

    window.addEventListener("resize", fitInfluenza);

    loadData();
    setInterval(loadData, 10 * 60 * 1000);
  </script>
</body>
</html>
