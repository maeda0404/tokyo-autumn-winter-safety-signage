<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>東京 秋冬安全情報</title><style>
:root{--g:clamp(4px,1vmin,10px);--r:clamp(8px,1.5vmin,16px)}*{box-sizing:border-box;margin:0;padding:0;font-family:"Yu Gothic","Meiryo",sans-serif}html,body{width:100%;height:100%;overflow:hidden;background:#edf2f7}body{padding:var(--g);display:grid;grid-template-rows:clamp(42px,11vh,70px) 1fr clamp(24px,6vh,36px);gap:var(--g)}header,footer{border-radius:var(--r);display:flex;align-items:center;justify-content:center}header{background:#1459ad;color:#fff;padding:0 14px;justify-content:space-between;font-size:clamp(16px,3.2vmin,34px);font-weight:900;white-space:nowrap}#clock{font-size:.8em}main{min-height:0;display:grid;grid-template-rows:1.12fr .88fr;gap:var(--g)}.flu{border:clamp(2px,.6vmin,4px) solid #6a35a7;border-radius:var(--r);background:#fbf7ff;display:grid;grid-template-rows:auto 1fr auto;overflow:hidden}.title{background:#6a35a7;color:#fff;text-align:center;padding:clamp(4px,1vh,9px);font-size:clamp(16px,3vmin,30px);font-weight:900}.flu-main{display:grid;grid-template-columns:.9fr 1.1fr;align-items:center;text-align:center;padding:var(--g)}.caption{font-size:clamp(13px,2.3vmin,23px);font-weight:800}.level{font-size:clamp(32px,7.5vmin,74px);font-weight:900;color:#7a3eb1}.week{grid-column:1/-1;font-size:clamp(11px,1.8vmin,18px);font-weight:700}.actions,.weather{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--g)}.actions{padding:var(--g);background:#eee2f8}.action{text-align:center;background:#fff;border-radius:8px;padding:5px 2px;font-size:clamp(12px,2vmin,20px);font-weight:900}.card{border:clamp(2px,.55vmin,4px) solid currentColor;border-radius:var(--r);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:var(--g);overflow:hidden}.name{font-size:clamp(19px,3.8vmin,38px);font-weight:900}.state{font-size:clamp(12px,2.1vmin,21px);font-weight:900}.note{font-size:clamp(10px,1.5vmin,15px);font-weight:700;color:#26323e}.wind{color:#1565c0;background:#f3f8ff}.dry{color:#d65a00;background:#fff8ee}.cold{color:#00796b;background:#effcf9}.active{box-shadow:inset 0 0 0 2px currentColor}footer{background:#fff;padding:0 8px;font-size:clamp(9px,1.4vmin,14px);font-weight:700;color:#505966;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}@media(max-aspect-ratio:4/5){main{grid-template-rows:1fr 1.5fr}.weather{grid-template-columns:1fr;grid-template-rows:repeat(3,1fr)}.card{flex-direction:row;justify-content:space-between}.note{display:none}}
</style></head><body><header><span>東京　秋冬安全情報</span><span id="clock">--:--:--</span></header><main><section class="flu"><div class="title">インフルエンザ情報</div><div class="flu-main"><div class="caption">東京都の<br>流行状況</div><div class="level" id="fluLevel">確認中</div><div class="week" id="fluWeek">取得中</div></div><div class="actions"><div class="action">手洗い</div><div class="action">換気</div><div class="action">体調報告</div></div></section><section class="weather"><article class="card wind" id="windCard"><div class="name">強風</div><div class="state" id="windState">確認中</div><div class="note" id="windNote"></div></article><article class="card dry" id="dryCard"><div class="name">乾燥</div><div class="state" id="dryState">確認中</div><div class="note" id="dryNote"></div></article><article class="card cold" id="coldCard"><div class="name">低温</div><div class="state" id="coldState">確認中</div><div class="note" id="coldNote"></div></article></section></main><footer id="footer">データ取得中</footer><script>
const U='./data/status.json';function clock(){clock=document.getElementById('clock');clock.textContent=new Date().toLocaleTimeString('ja-JP',{hour12:false})}function card(k,x){document.getElementById(k+'State').textContent=x.active?x.alertText:x.normalText;document.getElementById(k+'Note').textContent=x.note||'';document.getElementById(k+'Card').classList.toggle('active',!!x.active)}async function load(){try{let r=await fetch(U+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error(r.status);let d=await r.json();fluLevel.textContent=d.influenza.level;fluWeek.textContent=d.influenza.period+'　'+d.influenza.trend;card('wind',d.weather.wind);card('dry',d.weather.dry);card('cold',d.weather.cold);footer.textContent='更新：'+d.updated+'　'+(d.sourceStatus||'')}catch(e){footer.textContent='データ更新を確認してください'}}clock();setInterval(clock,1000);load();setInterval(load,600000);
</script></body></html>
